services:
  database:
    image: pgvector/pgvector:pg16
    container_name: navigator-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-navigator_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navigator_password}
      POSTGRES_DB: ${POSTGRES_DB:-navigator_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-navigator_user} -d ${POSTGRES_DB:-navigator_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  navigator-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tutorial-hell-navigator
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-5}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-navigator_user}:${POSTGRES_PASSWORD:-navigator_password}@database:5432/${POSTGRES_DB:-navigator_db}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
