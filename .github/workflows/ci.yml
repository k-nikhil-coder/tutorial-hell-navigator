name: CI Engine & Evaluation Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Automated Test Suite & Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Local Vector & BM25 Indexes
      run: |
        python -c "from scripts.rebuild_corpus_384 import rebuild_qdrant_indexes; rebuild_qdrant_indexes()"

    - name: Execute Pytest Suite
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy-key-for-unit-tests' }}
      run: |
        pytest tests/ eval/check_span_coverage.py -v -k "not test_api_streaming_endpoint and not test_api_structured_navigation"

    - name: Validate Gold Benchmark v2 Schema & Test Protection
      run: |
        python -c "
        import json, hashlib
        with open('eval/gold_benchmark_v2.json', 'r', encoding='utf-8') as f:
            data = json.load(f)
        assert len(data) == 65, f'Expected 65 benchmark questions, found {len(data)}'
        dev = [q for q in data if q.get('split') == 'dev']
        test = [q for q in data if q.get('split') == 'test']
        assert len(dev) == 40, f'Expected 40 dev questions, found {len(dev)}'
        assert len(test) == 25, f'Expected 25 test questions, found {len(test)}'
        with open('eval/test_ids.sha256', 'r', encoding='utf-8') as f:
            expected_hash = f.read().strip()
        test_ids_str = '\n'.join(sorted(q['id'] for q in test))
        actual_hash = hashlib.sha256(test_ids_str.encode('utf-8')).hexdigest()
        assert actual_hash == expected_hash, f'Test split tamper detected! Hash mismatch.'
        print(f'Verified Gold Benchmark v2 ({len(data)} questions: {len(dev)} dev, {len(test)} sealed test) successfully!')
        "

    - name: Execute Automated Retrieval CI Eval Gate (Day 46)
      run: |
        python eval/ci_eval_gate.py
