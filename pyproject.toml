[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tutorial-hell-navigator"
version = "1.0.0"
description = "Eval-first AI mentor and retrieval engine helping CS students escape tutorial paralysis and build production software"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kumbham Nikhil" }
]
keywords = [
    "rag", "eval-first", "fastapi", "gemini", "tutorial-hell",
    "structured-generation", "pydantic", "concurrency", "load-testing"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "google-genai>=0.1.1",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pymupdf>=1.23.0",
    "langchain-text-splitters>=0.0.1",
    "tiktoken>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
]
